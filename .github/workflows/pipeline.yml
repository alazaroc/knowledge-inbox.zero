  #       run: npm ci
  #     - name: Configure AWS credentials (OIDC)
  #       uses: aws-actions/configure-aws-credentials@v6
  #       with:
  #         role-to-assume: ${{ env.AWS_ROLE }}
  #         aws-region: ${{ env.AWS_REGION }}
  #     - name: Cache deployment hashes
  #       uses: actions/cache@v6
  #       with:
  #         path: .deploy-hashes/
  #         key: deploy-test-${{ github.sha }}
  #         restore-keys: |
  #           deploy-test-
  #     - name: Deploy to TEST environment
  #       run: ENV=test bash scripts/deploy.sh all

  # ─────────────────────────────────────────────────────────────
  # CD · Deploy to PROD (main only)
  # ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: [build]
    # Skipped (not failed) until AWS_ROLE_FOR_GITHUB_DEPLOYMENTS is configured.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS != ''
    environment:
      name: prod
    env:
      AWS_ROLE: ${{ vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate required variables
        run: |
          set -e
          if [[ -z "${AWS_ROLE}" ]]; then
            echo "Missing required variable: AWS_ROLE (vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS)"
            exit 1
          fi
          echo "Environment OK."
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Cache deployment hashes
        uses: actions/cache@v6
        with:
          path: .deploy-hashes/
          key: deploy-prod-${{ github.sha }}
          restore-keys: |
            deploy-prod-
      - name: Deploy to PROD environment
        run: ENV=prod bash scripts/deploy.sh all
