name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "eu-south-2"
  CI: true

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # CI · Stage 1: Static analysis
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run quality:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Run backend tests
        run: npm run test -w backend
      - name: Run frontend tests
        run: npm run test -w frontend

  # ─────────────────────────────────────────────────────────────
  # CI · Stage 2: Build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend (stub .env for build validation)
        run: |
          cat > frontend/.env <<EOF
          VITE_API_URL=https://stub.example.com
          VITE_USER_POOL_ID=stub
          VITE_USER_POOL_CLIENT_ID=stub
          EOF
          npm run build:frontend
      - name: CDK synth (validate infrastructure)
        run: |
          cd infra/cdk
          npx cdk synth --context env=prod --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          # Region is irrelevant for a compile-only synth; pin a valid one so
          # validation works even before {{AWS_REGION}} is replaced. AWS_REGION
          # must be overridden too, or the CDK CLI derives the region from it.
          AWS_REGION: "eu-west-1"
          AWS_DEFAULT_REGION: "eu-west-1"
          CDK_DEFAULT_REGION: "eu-west-1"

  # ─────────────────────────────────────────────────────────────
  # CD · Deploy to TEST (non-main branches, push only)
  # ─────────────────────────────────────────────────────────────
  # DISABLED — the test environment is retired for now (prod-only).
