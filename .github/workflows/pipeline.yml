  #         set -e
  #         if [[ -z "${AWS_ROLE}" ]]; then
  #           echo "Missing required variable: AWS_ROLE (vars.AWS_ROLE_FOR_GITHUB_DEPLOYMENTS)"
  #           exit 1
  #         fi
  #         echo "Environment OK."
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v7
  #       with:
  #         node-version: "22"
  #         cache: "npm"
